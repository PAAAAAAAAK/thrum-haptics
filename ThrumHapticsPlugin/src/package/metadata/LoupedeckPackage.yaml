# ==================================================================================================
# GENERAL SETTINGS
# ==================================================================================================

# Package type. Must be plugin4 for plugins.
type: plugin4

# Name that identifies the plugin.
name: ThrumHaptics

# Plugin name that is shown to the user. Spaced, unlike `name` above, which is
# the identity the Plugin Service keys the plugin folder and settings file on.
displayName: Thrum Haptics

# Short description of the plugin.
description: Universal haptic feedback - clicks, scroll and gestures, in every application.

# Name of the plugin library file.
pluginFileName: ThrumHapticsPlugin.dll

# Plugin version.
#
# 1.3.0 follows the published 1.2.0. The 1.2.9x and 1.2.10x numbers that appear
# in this branch's history were local test builds and were never released.
version: 1.3.0

# Author of the plugin. The author can be a company or an individual developer.
author: PAAAAAAAAK

# Copyright information.
copyright: Copyright © 2026 PAAAAAAAAK. MIT licensed.


# ==================================================================================================
# PLUGIN PROPERTIES
# ==================================================================================================

# Location of plugin files on Windows (relative to the plugin base directory).
# This parameter is required to support Windows.
pluginFolderWin: bin

# Location of plugin files on macOS (relative to the plugin base directory).
# This parameter is required to support Mac.
#
# A separate folder from pluginFolderWin, unlike Logitech's own plugins which
# point both at the same place. They can share because they are pure managed
# code; ours cannot. Windows ships uiohook.dll and a WinForms executable, macOS
# ships Avalonia and its Skia renderer, and neither has any business on the other
# platform. The Plugin Service loads only the folder matching the running OS.
#
# 'bin' HERE, rewritten to 'bin/mac' by tools/pack-release.ps1. The plain value
# is what a macOS-only build needs, since that tree has its own bin; the release
# package nests macOS under the Windows one, and the script does that rewrite so
# both layouts stay buildable from the same manifest.
pluginFolderMac: bin

# List of devices the plugin is optimized for.
supportedDevices:
    # ActionsRing is how this plugin is actually used: the single "Haptic Settings"
    # action is bound to an Actions Ring slot or a mouse button on an MX device.
    # The haptics themselves are not bound to any control - they follow real mouse
    # input - so this only governs where the settings action can be assigned.
    - ActionsRing

    # LoupedeckCtFamily covers the following devices: Loupedeck CT, Live and Live S,
    # Razer Stream Controller, and Razer Stream Controller X.
    - LoupedeckCtFamily

    # LoupedeckPlusFamily covers Loupedeck+ device. Uncomment the following line to support Loupedeck+.
    #- LoupedeckPlusFamily

# List of plugin capabilities.
pluginCapabilities:
    # Declares that this plugin maps events to haptic waveforms (events/extra/eventMapping.yaml).
    # Without this, Logi Options+ ignores our haptic mappings entirely.
    - HasHapticMapping

    # Uncomment the following line if this plugin is an application plugin.
    #- HasApplication

    # Uncomment the following line if the plugin sends keyboard shortcuts to the target application.
    #- ActivatesApplication

# Minimum Loupedeck version supported by the plugin.
minimumLoupedeckVersion: 6.0


# ==================================================================================================
# LOUPEDECK MARKETPLACE SETTINGS
# ==================================================================================================

# Name of the license that the plugin is licensed under. Select the one that you prefer.
# NOTE: GPL license is not compatible with Loupedeck Marketplace.
license: MIT

# URL of the plugin license.
licenseUrl: https://opensource.org/licenses/MIT

# URL of the support page where the users can send improvement suggestions and report bugs.
# The URL is shown in Loupedeck Marketplace. The page can be for example a GitHub issues page.
# NOTE: This setting is recommended when publishing the plugin in Loupedeck Marketplace.
supportPageUrl: https://github.com/PAAAAAAAAK/thrum-haptics/issues

# URL of the plugin homepage. The URL is shown in Loupedeck Marketplace.
homePageUrl: https://github.com/PAAAAAAAAK/thrum-haptics
